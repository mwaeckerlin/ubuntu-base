# Builds the images of this repository for amd64 and arm64 and publishes them
# on Docker Hub, on every push to a live branch, and in the hourly check when a
# parent image or a download changed or the image is a week old. The build
# itself is the reusable workflow docker-image.yml of mwaeckerlin/scratch; its
# README explains the setup.
#
# Every Ubuntu release that is still supported has its own branch, so its
# image keeps its own Dockerfile and ONBUILD contract:
#   master   -> latest, <version>          (current Ubuntu release)
#   jammy    -> jammy, jammy-v<version>    (Ubuntu 22.04)
#   noble    -> noble, noble-v<version>    (Ubuntu 24.04)
# GitHub starts scheduled runs on the default branch only, so the scheduled
# run of master starts this workflow on jammy and noble; that needs
# «actions: write».

name: docker

on:
  push:
    branches: [master, jammy, noble]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# one run per branch at a time; a branch never cancels the run of another
concurrency: docker-${{ github.ref_name }}

jobs:
  docker:
    uses: mwaeckerlin/scratch/.github/workflows/docker-image.yml@master
    permissions:
      actions: write
      contents: read
    with:
      branch-tags: '[{"branch": "jammy|noble", "suffix": "", "version": "v"}]'
    secrets: inherit
